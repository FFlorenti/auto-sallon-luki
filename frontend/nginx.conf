map $http_user_agent $is_preview_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|WhatsApp|Viber|TelegramBot|Twitterbot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Pinterest|Snapchat)" 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|uploads|health|swagger|openapi)(/|$) {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/cars/(\d+)/?$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        if ($is_preview_bot) {
            rewrite ^/cars/(\d+)/?$ /api/share/cars/$1 last;
        }
        try_files /index.html =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
